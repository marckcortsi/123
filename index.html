<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Tetris</h1>
            <p class="subtitle">Haz líneas, sube de nivel y rompe tu récord.</p>
        </header>
        <main class="game-area">
            <canvas id="board" width="300" height="600" aria-label="Tablero de Tetris"></canvas>
            <aside class="panel">
                <div class="panel-card">
                    <h2>Marcador</h2>
                    <div class="stats">
                        <div>
                            <span class="label">Puntos</span>
                            <span id="score">0</span>
                        </div>
                        <div>
                            <span class="label">Nivel</span>
                            <span id="level">1</span>
                        </div>
                        <div>
                            <span class="label">Líneas</span>
                            <span id="lines">0</span>
                        </div>
                    </div>
                </div>
                <div class="panel-card">
                    <h2>Siguiente</h2>
                    <canvas id="next" width="120" height="120" aria-label="Siguiente pieza"></canvas>
                </div>
                <div class="panel-card">
                    <h2>Controles</h2>
                    <ul>
                        <li>⬅️ ➡️ mover</li>
                        <li>⬆️ rotar</li>
                        <li>⬇️ caer rápido</li>
                        <li>Espacio: caída instantánea</li>
                        <li>P: pausar</li>
                    </ul>
                </div>
                <div class="panel-card actions">
                    <button id="start">Iniciar partida</button>
                    <button id="pause" disabled>Pausar</button>
                </div>
            </aside>
        </main>
        <div id="overlay" class="overlay hidden">
            <div class="message">
                <h2 id="overlayTitle">¡Game Over!</h2>
                <p id="overlayText">Presiona iniciar para volver a jugar.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
